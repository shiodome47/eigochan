<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf8ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="eigochan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="eigochan" />
    <title>eigochan — 英語を声に出すほど、街が育つ。</title>
    <script>
      // Chrome の beforeinstallprompt は 1 度しか飛ばず、
      // アプリのモジュールが読み込まれる前に来ることがある。
      // 取り逃がすと「ホーム画面に追加」ボタンが二度と出せないので、ここで受け止めておく。
      // (src/utils/installPrompt.ts がこの値を拾う)
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__eigochanInstallEvent = e;
        window.dispatchEvent(new Event("eigochan:installready"));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
